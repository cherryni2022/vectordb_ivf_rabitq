[project]
name = "vectordb"
version = "0.3.0"
description = "A lightweight vector database with IVF indexing and RaBitQ quantization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
# JIT acceleration (requires compatible LLVM)
# Note: numba requires llvmlite which needs matching LLVM version
# If installation fails, try: conda install numba
jit = [
    "numba>=0.56.0",
]
# GPU acceleration
gpu = [
    "torch>=2.0.0",
]
# All acceleration features
accel = [
    "numba>=0.56.0",
    "torch>=2.0.0",
]
# High-performance HNSW implementation
hnsw = [
    "hnswlib>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

